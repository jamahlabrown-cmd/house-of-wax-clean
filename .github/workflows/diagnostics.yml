name: House Of Wax diagnostics

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests certifi pandas streamlit
      - name: Run diagnostics
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIAGNOSTIC_ALERT_TO: hello@shophouseofwax.com
        run: python scripts/diagnostics.py
      - name: Run payment-flow check
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DIAG_TEST_SELLER_PASSWORD: ${{ secrets.DIAG_TEST_SELLER_PASSWORD }}
          DIAG_TEST_BUYER_PASSWORD: ${{ secrets.DIAG_TEST_BUYER_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIAGNOSTIC_ALERT_TO: hello@shophouseofwax.com
        run: python scripts/payment_flow_check.py
