name: Generate listing pages

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_listing_pages.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Generate static listing pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/generate_listing_pages.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "house-of-wax-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/listings docs/sitemap.xml
          git diff --cached --quiet || git commit -m "Auto-update listing pages [skip ci]"
          git push
