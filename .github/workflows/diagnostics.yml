name: House Of Wax diagnostics

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests certifi
      - name: Run diagnostics
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIAGNOSTIC_ALERT_TO: hello@shophouseofwax.com
        run: python scripts/diagnostics.py
